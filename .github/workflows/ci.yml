name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by the private secrets repo when this project's prod.env changes.
  workflow_dispatch:

# Only pull requests cancel older runs. On main a newer run waits, so a deploy is never
# stopped halfway through migrations.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm exec biome ci .
      - run: pnpm typecheck
      - name: Test (integration tests start Postgres with testcontainers)
        run: pnpm test
      - run: pnpm build
      - name: OpenAPI spec is up to date
        run: pnpm openapi && git diff --exit-code apps/api/openapi.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build api and web images
        run: docker compose --profile app build

  # Deploys main to Cloudflare. Off until the repo variable DEPLOY is "cloudflare",
  # so a new repo made from this template does not try to deploy.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY == 'cloudflare'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Check out the private secrets repo
        uses: actions/checkout@v5
        with:
          repository: altivola/secrets
          token: ${{ secrets.SECRETS_REPO_TOKEN }}
          path: .secrets
          persist-credentials: false

      - name: Load deploy settings
        run: |
          project=$(node -p "require('./package.json').name")
          echo "SECRETS_DIR=$PWD/.secrets/$project" >> "$GITHUB_ENV"
          load() { # file key
            value=$(grep -E "^$2=" "$1" | head -1 | cut -d= -f2-)
            [ -n "$value" ] || { echo "Missing $2 in $1"; exit 1; }
            echo "::add-mask::$value"
            echo "$2=$value" >> "$GITHUB_ENV"
          }
          load .secrets/ci.env CLOUDFLARE_API_TOKEN
          load .secrets/ci.env CLOUDFLARE_ACCOUNT_ID
          load ".secrets/$project/prod.env" NEON_DATABASE_URL

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: |
          docker run --rm -v "$PWD/packages/db/migrations:/migrations:ro" -e DATABASE_URL="$NEON_DATABASE_URL" \
            ghcr.io/amacneil/dbmate:2 --wait --no-dump-schema --migrations-dir /migrations up

      - name: Point Hyperdrive at the current database URL
        working-directory: apps/api
        run: |
          id=$(grep -oE '"id": *"[0-9a-f]{32}"' wrangler.jsonc | grep -oE '[0-9a-f]{32}')
          url=$(node -e 'const u = new URL(process.argv[1]); u.searchParams.delete("channel_binding"); console.log(u.toString())' "$NEON_DATABASE_URL")
          echo "::add-mask::$url"
          pnpm exec wrangler hyperdrive update "$id" --connection-string="$url" > /dev/null

      - name: Deploy Altivola Auth
        if: github.repository == 'altivola/starter'
        run: |
          file=.secrets/auth/prod.env
          if [ ! -f "$file" ]; then
            echo "Auth production settings are unavailable"
            exit 0
          fi
          database_url=$(grep '^NEON_DATABASE_URL=' "$file" | head -1 | cut -d= -f2-)
          [ -n "$database_url" ]
          echo "::add-mask::$database_url"
          docker run --rm -v "$PWD/packages/db/migrations:/migrations:ro" -e DATABASE_URL="$database_url" \
            ghcr.io/amacneil/dbmate:2 --wait --no-dump-schema --migrations-dir /migrations up
          config=apps/api/wrangler.auth.jsonc
          id=$(grep -oE '"id": *"[0-9a-f]{32}"' "$config" | grep -oE '[0-9a-f]{32}')
          url=$(node -e 'const u = new URL(process.argv[1]); u.searchParams.delete("channel_binding"); console.log(u.toString())' "$database_url")
          echo "::add-mask::$url"
          pnpm --filter @app/server exec wrangler hyperdrive update "$id" --connection-string="$url" > /dev/null
          SECRETS_DIR="$PWD/.secrets/auth" node scripts/secrets.ts deploy-auth

      - name: Build web assets
        run: pnpm --filter @app/web build

      - name: Deploy the Worker and its secrets
        run: node scripts/secrets.ts deploy
