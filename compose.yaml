services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["127.0.0.1:${DB_PORT:-5432}:5432"]
    volumes: [db:/var/lib/postgresql]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 2s
      retries: 15

  migrate:
    image: ghcr.io/amacneil/dbmate:2
    command: --wait --no-dump-schema --migrations-dir /migrations up
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app?sslmode=disable
    volumes: ["./packages/db/migrations:/migrations:ro"]
    depends_on:
      db: { condition: service_healthy }

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:${MAILPIT_PORT:-8025}:8025"]

  api:
    profiles: [app]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      MAIL_PROVIDER: mailpit
      MAILPIT_URL: http://mailpit:8025
      BETTER_AUTH_URL: http://localhost:8080
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-change-me-change-me-32ch}
      PORT: "3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_started }

  web:
    profiles: [app]
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]
    depends_on: [api]

volumes:
  db:
